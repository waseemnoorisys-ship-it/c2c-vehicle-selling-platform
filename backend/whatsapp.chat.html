<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WhatsApp Chat Demo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Roboto, sans-serif;
        }

        html,
        body {

            height: 100%;
            background: #111b21;

        }

        body {

            overflow: hidden;

        }

        :root {

            --primary: #005c4b;
            --secondary: #202c33;
            --header: #202c33;
            --chat: #0b141a;
            --sidebar: #111b21;

            --green: #25d366;

            --text: #e9edef;
            --light: #8696a0;

            --my: #005c4b;
            --other: #202c33;

            --border: #2a3942;

        }

        .app {

            display: flex;

            height: 100vh;
            width: 100%;

        }

        /*************************
SIDEBAR
**************************/

        .sidebar {

            width: 380px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);

            display: flex;
            flex-direction: column;

        }

        .sidebar-header {

            height: 60px;

            padding: 15px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: var(--header);

        }

        .sidebar-header img {

            width: 40px;
            height: 40px;

            border-radius: 50%;
            object-fit: cover;

        }

        .sidebar-icons {

            display: flex;
            gap: 18px;

            color: var(--light);

            font-size: 18px;

            cursor: pointer;

        }

        .search-box {

            padding: 10px;

            background: #111b21;

        }

        .search-box input {

            width: 100%;
            padding: 12px;

            border: none;
            outline: none;

            border-radius: 8px;

            background: #202c33;

            color: white;

        }

        .conversation-list {

            flex: 1;

            overflow: auto;

        }

        .conversation {

            display: flex;
            gap: 15px;

            padding: 12px;

            cursor: pointer;

            border-bottom: 1px solid #1d2a31;

            transition: .2s;

        }

        .conversation:hover {

            background: #202c33;

        }

        .conversation img {

            width: 50px;
            height: 50px;

            border-radius: 50%;
            object-fit: cover;

        }

        .conv-info {

            flex: 1;

        }

        .conv-top {

            display: flex;
            justify-content: space-between;

        }

        .conv-name {

            font-weight: 500;
            color: white;

        }

        .conv-time {

            font-size: 12px;
            color: gray;

        }

        .conv-last {

            margin-top: 5px;

            font-size: 14px;
            color: #8696a0;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

        }

        .badge {

            background: #25d366;
            color: black;

            padding: 2px 7px;

            font-size: 12px;

            border-radius: 20px;

            font-weight: bold;

        }

        /*************************
CHAT AREA
**************************/

        .chat {

            flex: 1;

            display: flex;
            flex-direction: column;

            background: #0b141a;

            position: relative;

        }

        .chat-header {

            height: 60px;

            background: #202c33;

            display: flex;
            align-items: center;

            justify-content: space-between;

            padding: 0 15px;

            border-left: 1px solid #2a3942;

        }

        .chat-user {

            display: flex;
            align-items: center;
            gap: 15px;

        }

        .chat-user img {

            width: 42px;
            height: 42px;

            border-radius: 50%;
            object-fit: cover;

        }

        .user-details {

            display: flex;
            flex-direction: column;

        }

        .user-name {

            color: white;
            font-weight: 500;

        }

        .user-status {

            font-size: 13px;

            color: #8696a0;

        }

        .chat-actions {

            display: flex;
            gap: 20px;

            font-size: 18px;

            color: #8696a0;

            cursor: pointer;

        }

        .chat-body {

            flex: 1;

            overflow: auto;

            padding: 25px;

            background-image: url("https://i.imgur.com/3QZ7X3k.png");

            background-size: cover;

            display: flex;
            flex-direction: column;

            gap: 10px;

        }

        /*************************
MESSAGE BUBBLES
**************************/

        .message {

            max-width: 70%;

            padding: 10px 14px;

            border-radius: 8px;

            position: relative;

            word-wrap: break-word;

            font-size: 15px;

            animation: fadeIn .2s linear;

        }

        .message.me {

            align-self: flex-end;

            background: var(--my);

            color: white;

        }

        .message.other {

            align-self: flex-start;

            background: var(--other);

            color: white;

        }

        .message img {

            width: 250px;

            border-radius: 8px;

            cursor: pointer;

            margin-top: 8px;

        }

        .message-footer {

            display: flex;

            justify-content: flex-end;

            align-items: center;

            gap: 5px;

            margin-top: 5px;

            font-size: 11px;

            color: #d1d7db;

        }

        .edited {

            font-style: italic;

            font-size: 11px;

            opacity: .8;

            margin-right: auto;

        }

        .deleted {

            font-style: italic;

            color: #8696a0;

        }

        .typing {

            display: flex;

            align-items: center;

            gap: 4px;

            padding: 10px;

            width: 70px;

            background: #202c33;

            border-radius: 15px;

        }

        .typing span {

            width: 8px;
            height: 8px;

            background: #d1d7db;

            border-radius: 50%;

            animation: bounce 1.4s infinite;

        }

        .typing span:nth-child(2) {

            animation-delay: .2s;

        }

        .typing span:nth-child(3) {

            animation-delay: .4s;

        }

        @keyframes bounce {

            0% {

                transform: translateY(0);

                opacity: .5;

            }

            50% {

                transform: translateY(-5px);

                opacity: 1;

            }

            100% {

                transform: translateY(0);

                opacity: .5;

            }

        }

        @keyframes fadeIn {

            from {

                opacity: 0;
                transform: translateY(10px);

            }

            to {

                opacity: 1;
                transform: translateY(0);

            }

        }

        /*************************
INPUT AREA
**************************/

        .chat-footer {

            height: 65px;

            background: #202c33;

            display: flex;

            align-items: center;

            padding: 0 15px;

            gap: 15px;

        }

        .chat-footer button {

            background: none;

            border: none;

            font-size: 22px;

            cursor: pointer;

            color: #8696a0;

        }

        .chat-footer input {

            flex: 1;

            padding: 12px 15px;

            border: none;

            outline: none;

            border-radius: 8px;

            background: #2a3942;

            color: white;

            font-size: 15px;

        }

        .send-btn {

            color: #25d366 !important;

        }

        /*************************
LOGIN MODAL
**************************/

        .login-screen {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: #111b21;

            display: flex;

            justify-content: center;

            align-items: center;

            z-index: 999;

        }

        .login-card {

            width: 420px;

            background: #202c33;

            padding: 30px;

            border-radius: 10px;

            display: flex;

            flex-direction: column;

            gap: 15px;

        }

        .login-card h2 {

            color: white;

            text-align: center;

        }

        .login-card input {

            padding: 14px;

            border: none;

            outline: none;

            background: #2a3942;

            color: white;

            border-radius: 8px;

        }

        .login-card button {

            padding: 14px;

            background: #25d366;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        /*************************
LIGHTBOX
**************************/

        .lightbox {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, .9);

            display: none;

            justify-content: center;

            align-items: center;

            z-index: 5000;

        }

        .lightbox img {

            max-width: 90%;
            max-height: 90%;

            border-radius: 10px;

            cursor: pointer;

        }

        /*************************
RESPONSIVE
**************************/

        @media(max-width:900px) {

            .sidebar {

                width: 100px;

            }

            .conv-info {

                display: none;

            }

            .search-box {

                display: none;

            }

        }
    </style>

</head>

<body>

    <div class="app">

        <!-- LEFT SIDEBAR -->

        <div class="sidebar">

            <div class="sidebar-header">

                <img id="myProfile" src="https://i.pravatar.cc/150?img=12">

                <div class="sidebar-icons">

                    <i class="fa-solid fa-users"></i>

                    <i class="fa-solid fa-message"></i>

                    <i class="fa-solid fa-ellipsis-vertical"></i>

                </div>

            </div>

            <div class="search-box">

                <input id="searchConversation" type="text" placeholder="Search conversations">

            </div>

            <div id="conversationList" class="conversation-list">

                <!-- Dynamic Conversation List -->

            </div>

        </div>

        <!-- CHAT -->

        <div class="chat">

            <div class="chat-header">

                <div class="chat-user">

                    <img id="chatAvatar" src="https://i.pravatar.cc/150?img=11">

                    <div class="user-details">

                        <div id="chatName" class="user-name">

                            Select Conversation

                        </div>

                        <div id="chatStatus" class="user-status">

                            Offline

                        </div>

                    </div>

                </div>

                <div class="chat-actions">

                    <i class="fa-solid fa-phone"></i>

                    <i class="fa-solid fa-video"></i>

                    <i class="fa-solid fa-ellipsis-vertical"></i>

                </div>

            </div>

            <div id="chatBody" class="chat-body">

                <!-- Dynamic Messages -->

            </div>

            <div class="chat-footer">

                <button id="imageBtn">

                    <i class="fa-solid fa-paperclip"></i>

                </button>

                <input type="file" id="imageInput" hidden>

                <input id="messageInput" type="text" placeholder="Type a message">

                <button id="sendBtn" class="send-btn">

                    <i class="fa-solid fa-paper-plane"></i>

                </button>

            </div>

        </div>

    </div>

    <div id="lightbox" class="lightbox">

        <img id="lightboxImage">

    </div>

    <div id="loginScreen" class="login-screen">

        <div class="login-card">

            <h2>

                Chat Demo

            </h2>

            <input id="baseUrl" placeholder="Base URL">

            <input id="jwtToken" placeholder="JWT Token">

            <button id="connectBtn">

                Connect

            </button>

        </div>

    </div>

    <script>

        /******************************************************************
    CONFIG
    ******************************************************************/

        let socket = null;

        let token = "";

        let BASE_URL = "";

        let currentConversation = null;

        let myUserId = null;

        let typingTimeout = null;

        let isTyping = false;

        let browserFocused = true;

        let page = 1;

        let limit = 20;

        let loadingMessages = false;

        let hasMoreMessages = true;

        let conversationCache = [];

        let messageCache = [];

        const chatBody =
            document.getElementById("chatBody");

        const conversationList =
            document.getElementById("conversationList");

        const messageInput =
            document.getElementById("messageInput");

        /******************************************************************
        JWT DECODER
        ******************************************************************/

        function parseJwt(token) {

            try {

                const base64 =
                    token.split(".")[1];

                const json =
                    atob(base64);

                return JSON.parse(json);

            } catch (e) {

                return null;

            }

        }

        function extractUserId() {

            const data = parseJwt(token);

            if (!data) return null;

            return data.userId ||
                data.id ||
                data._id ||
                null;

        }

        /******************************************************************
        REST API HELPER
        ******************************************************************/

        async function api(url, method = "POST", body = null, isForm = false) {

            const headers = {

                Authorization: "Bearer " + token

            };

            if (!isForm) {

                headers["Content-Type"] = "application/json";

            }

            const response =
                await fetch(

                    BASE_URL + url,

                    {

                        method,

                        headers,

                        body: isForm ? body : JSON.stringify(body)

                    }

                );

            const json =
                await response.json();

            if (!response.ok) {

                throw new Error(

                    json.message ||

                    "API Error"

                );

            }

            return json;

        }

        /******************************************************************
        TIME FORMAT
        ******************************************************************/

        function formatTime(date) {

            if (!date) return "";

            const d = new Date(date);

            return d.toLocaleTimeString([],
                {

                    hour: "2-digit",

                    minute: "2-digit"

                });

        }

        function formatLastSeen(date) {

            if (!date) return "";

            const d = new Date(date);

            return "Last seen " +

                d.toLocaleString();

        }

        /******************************************************************
        AUTO SCROLL
        ******************************************************************/

        function scrollBottom() {

            chatBody.scrollTop =

                chatBody.scrollHeight;

        }

        /******************************************************************
        CLEAR CHAT
        ******************************************************************/

        function clearMessages() {

            chatBody.innerHTML = "";

        }

        /******************************************************************
        SHOW STATUS
        ******************************************************************/

        function setStatus(text) {

            document
                .getElementById("chatStatus")
                .innerHTML = text;

        }

        /******************************************************************
        SET HEADER
        ******************************************************************/

        function setHeader(conversation) {

            const other =
                conversation.buyerId._id === myUserId
                    ? conversation.vendorId
                    : conversation.buyerId;

            document
                .getElementById("chatAvatar")
                .src =

                other.profilePhoto ||

                "https://i.pravatar.cc/150";

            document
                .getElementById("chatName")
                .innerHTML =

                other.firstName +

                " " +

                other.lastName;

        }

        /******************************************************************
        MESSAGE HTML
        ******************************************************************/

        function messageHTML(message) {

            const mine =

                message.senderId._id ===

                myUserId;

            let ticks = "";

            if (mine) {

                if (message.isRead) {

                    ticks =

                        '<i class="fa-solid fa-check-double" style="color:#53bdeb"></i>';

                } else {

                    ticks =

                        '<i class="fa-solid fa-check"></i>';

                }

            }

            let edited = "";

            if (message.isEdited) {

                edited =

                    '<span class="edited">edited</span>';

            }

            let body = "";

            if (message.isDeleted) {

                body =

                    '<div class="deleted">This message was deleted</div>';

            } else {

                if (message.type === "image") {

                    body =

                        '<img src="' +

                        message.content +

                        '">';

                } else {

                    body =

                        message.content;

                }

            }

            return `

<div
class="message ${mine ? 'me' : 'other'}"
id="${message._id}">

<div>

${body}

</div>

<div class="message-footer">

${edited}

<span>

${formatTime(message.createdAt)}

</span>

${ticks}

</div>

</div>

`;

        }

        /******************************************************************
        RENDER MESSAGES
        ******************************************************************/

        function renderMessages(messages) {

            clearMessages();

            messageCache = messages;

            messages.forEach(msg => {

                chatBody.insertAdjacentHTML(

                    "beforeend",

                    messageHTML(msg)

                );

            });

            scrollBottom();

        }

        /******************************************************************
        ADD ONE MESSAGE
        ******************************************************************/

        function appendMessage(message) {

            messageCache.push(message);

            chatBody.insertAdjacentHTML(

                "beforeend",

                messageHTML(message)

            );

            scrollBottom();

        }

        /******************************************************************
        LOAD CONVERSATIONS
        ******************************************************************/

        async function loadConversations() {

            try {

                const res = await api(

                    "/api/v1/chat/conversations/mine",

                    "POST",

                    {

                        page: 1,

                        limit: 20

                    }

                );

                conversationCache =

                    res.data.conversations || [];

                renderConversationList();

            } catch (err) {

                alert(err.message);

            }

        }

        /******************************************************************
        CONVERSATION LIST
        ******************************************************************/

        function renderConversationList() {

            conversationList.innerHTML = "";

            conversationCache.forEach(conversation => {

                const other =
                    conversation.buyerId._id === myUserId
                        ? conversation.vendorId
                        : conversation.buyerId;

                const unread =
                    conversation.buyerId._id === myUserId
                        ? conversation.buyerUnread
                        : conversation.vendorUnread;

                conversationList.insertAdjacentHTML(

                    "beforeend",

                    `

<div
class="conversation"

onclick="openConversation('${conversation._id}')">

<img src="${other.profilePhoto || 'https://ui-avatars.com/api/?name=' + other.firstName}">

<div class="conv-info">

<div class="conv-top">

<div class="conv-name">

${other.firstName} ${other.lastName}

</div>

<div class="conv-time">

${formatTime(

                        conversation.lastMessageAt

                    )}

</div>

</div>

<div class="conv-last">

${conversation.lastMessage || ""}

</div>

</div>

${unread > 0

                        ?

                        `<div class="badge">

${unread}

</div>`

                        : ""

                    }

</div>

`

                );

            });

        }

        /******************************************************************
        OPEN CONVERSATION
        ******************************************************************/
        async function openConversation(id) {

            currentConversation = id;

            page = 1;

            hasMoreMessages = true;

            loadingMessages = false;

            try {

                const response = await api(
                    "/api/v1/chat/conversations/get",
                    "POST",
                    {
                        conversationId: id
                    }
                );

                const conversation = response.data.conversation;

                setHeader(conversation);

                const other =
                    conversation.buyerId._id === myUserId
                        ? conversation.vendorId
                        : conversation.buyerId;

                socket.emit("get_presence", {
                    userId: other._id
                });

                socket.emit("join_conversation", {
                    conversationId: id
                });

                await loadMessages();

            } catch (err) {
                console.error(err);
                alert(err.message);
            }
        }


        /******************************************************************
        LOAD MESSAGE HISTORY
        ******************************************************************/

        async function loadMessages() {

            const res =

                await api(

                    "/api/v1/chat/messages/list",

                    "POST",

                    {

                        conversationId: currentConversation,

                        page,

                        limit

                    }

                );

            const messages =

                res.data.messages || [];

            renderMessages(messages);

            socket.emit(

                "mark_read",

                {

                    conversationId: currentConversation

                }

            );

        }

        /******************************************************************
        LOGIN
        ******************************************************************/

        document

            .getElementById("connectBtn")

            .onclick = connect;

        /******************************************************************
        CONNECT
        ******************************************************************/

        function connect() {

            BASE_URL =

                document

                    .getElementById("baseUrl")

                    .value

                    .trim();

            token =

                document

                    .getElementById("jwtToken")

                    .value

                    .trim();

            if (!BASE_URL) {

                return alert("Base URL Required");

            }

            if (!token) {

                return alert("JWT Required");

            }

            myUserId =

                extractUserId();

            socket = io(

                BASE_URL,

                {

                    auth: { token },

                    transports: [

                        "websocket",

                        "polling"

                    ]

                }

            );

            registerSocketEvents();

        }

        /******************************************************************
        CONNECTED
        ******************************************************************/

        function connected() {

            document

                .getElementById("loginScreen")

                .style.display = "none";

            loadConversations();

        }

        /******************************************************************
        SOCKET EVENTS
        ******************************************************************/

        function registerSocketEvents() {

            socket.on(

                "connect",

                connected

            );

            socket.on(

                "connect_error",

                e => {

                    alert(e.message);

                });

            socket.on(

                "disconnect",

                () => {

                    console.log(

                        "Disconnected"

                    );

                });

            /******************************************************************
            NEW MESSAGE
            ******************************************************************/

            socket.on(

                "new_message",

                message => {

                    if (

                        message.conversationId !==

                        currentConversation

                    )

                        return;

                    appendMessage(message);

                    socket.emit(

                        "mark_read",

                        {

                            conversationId:

                                currentConversation

                        }

                    );

                });

            /******************************************************************
            MESSAGES READ
            ******************************************************************/

            socket.on(

                "messages_read",

                data => {

                    messageCache.forEach(msg => {

                        if (

                            msg.senderId._id ===

                            myUserId

                        ) {

                            msg.isRead = true;

                        }

                    });

                    renderMessages(messageCache);

                });

            /******************************************************************
            TYPING
            ******************************************************************/

            socket.on(

                "user_typing",

                data => {

                    if (

                        data.conversationId !==

                        currentConversation

                    )

                        return;

                    showTyping();

                });

            socket.on(

                "user_stop_typing",

                hideTyping);

            /******************************************************************
            PRESENCE
            ******************************************************************/

            socket.on(

                "presence_data",

                data => {

                    if (data.isOnline) {

                        setStatus("Online");

                    } else {

                        setStatus(

                            formatLastSeen(

                                data.lastSeen

                            )

                        );

                    }

                });

            socket.on(

                "user_online",

                () => {

                    setStatus("Online");

                });

            socket.on(

                "user_offline",

                data => {

                    setStatus(

                        formatLastSeen(

                            data.lastSeen

                        )

                    );

                });

        }
        /******************************************************************
        TYPING
        ******************************************************************/

        function showTyping() {

            if (document.getElementById("typingIndicator")) return;

            chatBody.insertAdjacentHTML(

                "beforeend",

                `

<div
id="typingIndicator"
class="typing">

<span></span>

<span></span>

<span></span>

</div>

`

            );

            scrollBottom();

        }

        function hideTyping() {

            const typing =

                document.getElementById(

                    "typingIndicator"

                );

            if (typing) {

                typing.remove();

            }

        }

        /******************************************************************
        SEND MESSAGE
        ******************************************************************/

        document

            .getElementById(

                "sendBtn"

            )

            .onclick =

            sendMessage;

        messageInput

            .addEventListener(

                "keydown",

                e => {

                    if (e.key === "Enter") {

                        sendMessage();

                    }

                });

        function sendMessage() {

            if (!currentConversation) return;

            const text =

                messageInput.value.trim();

            if (!text) return;

            socket.emit(

                "send_message",

                {

                    conversationId:

                        currentConversation,

                    content: text,

                    type: "text"

                }

            );

            messageInput.value = "";

            stopTyping();

        }

        /******************************************************************
        TYPING EVENTS
        ******************************************************************/

        messageInput

            .addEventListener(

                "input",

                () => {

                    if (!currentConversation) return;

                    if (!isTyping) {

                        isTyping = true;

                        socket.emit(

                            "typing",

                            {

                                conversationId:

                                    currentConversation

                            }

                        );

                    }

                    clearTimeout(

                        typingTimeout

                    );

                    typingTimeout =

                        setTimeout(

                            stopTyping,

                            1200

                        );

                });

        function stopTyping() {

            if (!isTyping) return;

            isTyping = false;

            socket.emit(

                "stop_typing",

                {

                    conversationId:

                        currentConversation

                }

            );

        }

        /******************************************************************
        IMAGE UPLOAD
        ******************************************************************/

        document

            .getElementById(

                "imageBtn"

            )

            .onclick =

            () => {

                document

                    .getElementById(

                        "imageInput"

                    )

                    .click();

            };

        document

            .getElementById(

                "imageInput"

            )

            .onchange =

            uploadImage;

        async function uploadImage() {

            const file =

                this.files[0];

            if (!file) return;

            const form =

                new FormData();

            form.append(

                "conversationId",

                currentConversation

            );

            form.append(

                "image",

                file

            );

            try {

                await api(

                    "/api/v1/chat/messages/upload-image",

                    "POST",

                    form,

                    true

                );

            } catch (err) {

                alert(err.message);

            }

            this.value = "";

        }

        /******************************************************************
        LIGHTBOX
        ******************************************************************/

        chatBody

            .addEventListener(

                "click",

                e => {

                    if (

                        e.target.tagName === "IMG"

                    ) {

                        document

                            .getElementById(

                                "lightbox"

                            )

                            .style.display =

                            "flex";

                        document

                            .getElementById(

                                "lightboxImage"

                            )

                            .src =

                            e.target.src;

                    }

                });

        document

            .getElementById(

                "lightbox"

            )

            .onclick =

            () => {

                document

                    .getElementById(

                        "lightbox"

                    )

                    .style.display =

                    "none";

            };

        /******************************************************************
        SEARCH
        ******************************************************************/

        document

            .getElementById(

                "searchConversation"

            )

            .addEventListener(

                "input",

                function () {

                    const q =

                        this.value

                            .toLowerCase();

                    document

                        .querySelectorAll(

                            ".conversation"

                        )

                        .forEach(card => {

                            card.style.display =

                                card.innerText

                                    .toLowerCase()

                                    .includes(q)

                                    ?

                                    "flex"

                                    :

                                    "none";

                        });

                });

        /******************************************************************
        BROWSER NOTIFICATIONS
        ******************************************************************/

        if (

            "Notification"

            in window

        ) {

            Notification.requestPermission();

        }

        document

            .addEventListener(

                "visibilitychange",

                () => {

                    browserFocused =

                        !document.hidden;

                });

        socket?.on?.(

            "new_message",

            msg => {

                if (

                    browserFocused

                ) return;

                if (

                    Notification.permission

                    ===

                    "granted"

                ) {

                    new Notification(

                        "New Message",

                        {

                            body:

                                msg.content

                        }

                    );

                }

            });

        /******************************************************************
        INFINITE SCROLL
        ******************************************************************/

        chatBody

            .addEventListener(

                "scroll",

                async () => {

                    if (

                        chatBody.scrollTop >

                        50

                    )

                        return;

                    if (

                        loadingMessages ||

                        !hasMoreMessages

                    )

                        return;

                    loadingMessages = true;

                    page++;

                    try {

                        const res =

                            await api(

                                "/api/v1/chat/messages/list",

                                "POST",

                                {

                                    conversationId:

                                        currentConversation,

                                    page,

                                    limit

                                }

                            );

                        const older =

                            res.data.messages || [];

                        if (

                            older.length === 0

                        ) {

                            hasMoreMessages = false;

                        } else {

                            messageCache = [

                                ...older,

                                ...messageCache

                            ];

                            renderMessages(

                                messageCache

                            );

                        }

                    } catch (e) {

                        console.log(e);

                    }

                    loadingMessages = false;

                });

        /******************************************************************
        EDIT / DELETE PLACEHOLDER
        ******************************************************************/

        chatBody

            .addEventListener(

                "contextmenu",

                async e => {

                    e.preventDefault();

                    const bubble =

                        e.target.closest(

                            ".message"

                        );

                    if (!bubble) return;

                    const id =

                        bubble.id;

                    const action =

                        prompt(

                            "Type EDIT or DELETE"

                        );

                    if (

                        !action

                    ) return;

                    if (

                        action

                            .toLowerCase()

                        === "delete"

                    ) {

                        await api(

                            "/api/v1/chat/messages/delete",

                            "POST",

                            {

                                messageId: id

                            }

                        );

                    }

                    if (

                        action

                            .toLowerCase()

                        === "edit"

                    ) {

                        const text =

                            prompt(

                                "New Message"

                            );

                        if (!text) return;

                        await api(

                            "/api/v1/chat/messages/edit",

                            "POST",

                            {

                                messageId: id,

                                newContent: text

                            }

                        );

                    }

                });

        /******************************************************************
        WINDOW END
        ******************************************************************/

    </script>

</body>

</html>
