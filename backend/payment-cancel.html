<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Cancelled - C2C Vehicle Platform</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: #f59e0b;
      font-size: 36px;
      font-weight: bold;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .hint-box {
      display: none;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 10px;
      padding: 12px 16px;
      color: #f59e0b;
      font-size: 14px;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-warning {
      background: #d97706;
      color: #ffffff;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #ffffff;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">✕</div>
    <h1>Payment Cancelled</h1>
    <p>
      The checkout session was cancelled and no charges were made. You can return to <strong>ChatGPT</strong> or your chat assistant to retry when you're ready.
    </p>

    <div id="closeHint" class="hint-box">
      You can now safely close this browser tab and return to ChatGPT.
    </div>

    <div class="btn-group">
      <button id="returnBtn" class="btn btn-primary" onclick="handleReturn()">Return to Chat</button>
      <a href="https://c2c-vehicle-selling-platform.vercel.app" class="btn btn-secondary">Back to Marketplace</a>
    </div>

    <div class="footer-note">
      You can re-open checkout at any time.
    </div>
  </div>

  <script>
    function handleReturn() {
      const btn = document.getElementById("returnBtn");
      const hint = document.getElementById("closeHint");

      try {
        window.close();
      } catch (e) {}

      try {
        window.open('', '_self', '');
        window.close();
      } catch (e) {}

      setTimeout(function() {
        hint.style.display = "block";
        btn.className = "btn btn-warning";
        btn.textContent = "Switch to your ChatGPT Tab";
        btn.onclick = function() {
          if (document.referrer && document.referrer.includes("chatgpt.com")) {
            window.location.href = document.referrer;
          } else {
            window.location.href = "https://chatgpt.com";
          }
        };
      }, 150);
    }
  </script>
</body>
</html>
